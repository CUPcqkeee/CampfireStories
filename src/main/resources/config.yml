settings:
  # Разрешать обычные и синие костры для историй
  allow-soul-campfire: true
  # Разрешать владельцу делать историю публичной
  allow-public-stories: true
  # Удалять историю, когда костёр сломан
  delete-story-on-break: true
  # Защищать костры с историями: ломать их может только владелец/соавтор/админ
  protect-campfire: false
  # Название истории по умолчанию
  default-title: "Новая история"
  # Максимальная длина названия
  max-title-length: 40
  # Максимум страниц в истории (лимит Minecraft: 50)
  max-pages: 50
  # Максимум соавторов у одной истории
  max-authors: 8
  # Радиус (в блоках), в котором команда /campfire находит костёр для управления
  manage-radius: 10
  # Радиус оповещения игроков, когда кто-то читает историю (0 = выключить)
  read-notify-radius: 16
  # Задержка между открытиями меню/книги в миллисекундах
  edit-cooldown-ms: 1500
  # Кто видит истории в /campfire list
  #   owner  - только владелец
  #   author - владелец и соавторы
  list-visibility: author

